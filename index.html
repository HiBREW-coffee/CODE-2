<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" type="image/png" href="CODEX.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeX V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 15% 50%, #12151f 0%, #06070a 100%);
            color: #ffffff;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 226, 232, 0.15) 0%, rgba(37, 226, 232, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container { max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 2rem; position: relative; z-index: 1; }
        
        .header { text-align: left; position: relative; margin-bottom: 0.5rem; }
        .header h1 { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #3ae2b2 0%, #25e2e8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.04em; }
        .header p { font-size: 1rem; color: #8a93a6; margin-top: 0.4rem; font-weight: 400; }

        .glass-card {
            background: rgba(26, 29, 36, 0.75); 
            border-radius: 1.25rem;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); 
            position: relative;
        }

        .card-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 2rem; color: #ffffff; letter-spacing: -0.02em; display: flex; justify-content: space-between; align-items: center;}
        
        .btn-group { display: flex; gap: 1rem; }
        .btn { padding: 0.6rem 1.2rem; border-radius: 0.75rem; font-size: 0.9rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s ease-in-out; }
        .btn-save { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        .btn-save:hover { box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); transform: translateY(-1px); }
        .btn-add { background: rgba(255, 255, 255, 0.05); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-add:hover { background: rgba(255, 255, 255, 0.1); }

        .country-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        .country-box { 
            background: rgba(10, 12, 16, 0.6); 
            padding: 1.5rem; border-radius: 1rem; 
            border: 1px solid rgba(0, 0, 0, 0.5); 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3); 
            display: flex; flex-direction: column; gap: 0.75rem; transition: all 0.2s; position: relative; 
        }
        .country-box:focus-within { border: 1px solid rgba(58, 226, 178, 0.4); box-shadow: 0 0 15px rgba(58, 226, 178, 0.1), inset 0 2px 10px rgba(0,0,0,0.3); }
        
        .country-info { display: flex; gap: 0.75rem; align-items: center; }
        .country-info input { padding: 0.5rem; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 0.6rem; font-size: 1rem; font-weight: 700; text-align: center; background: rgba(255, 255, 255, 0.03); color: white; transition: border 0.2s;}
        .country-info input:focus { border-color: rgba(58, 226, 178, 0.5); }
        .country-info input::placeholder { color: rgba(255, 255, 255, 0.2); font-weight: normal; }
        .c-code { flex: 1; text-transform: uppercase; }
        .c-curr { width: 70px; color: #3ae2b2; }
        
        .btn-remove { position: absolute; top: 1.2rem; right: 1.2rem; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: all 0.2s;}
        .btn-remove:hover { background: rgba(239, 68, 68, 0.25); transform: scale(1.1); }

        textarea {
            width: 100%; height: 120px; padding: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 0.75rem;
            font-size: 0.85rem; font-family: monospace; resize: none; line-height: 1.5; color: #cbd5e1; background: transparent;
        }
        textarea:focus { border-color: rgba(58, 226, 178, 0.4); outline: none; }
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        
        .control-panel { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
        
        .main-inputs { display: flex; gap: 1.5rem; flex: none; flex-wrap: wrap; }
        .input-pair { display: flex; flex-direction: column; gap: 0.6rem; }
        label { font-size: 0.9rem; font-weight: 700; color: #8a93a6; }
        .main-inputs input, .main-inputs select { padding: 1rem; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 0.8rem; font-size: 1.1rem; font-weight: 700; width: 150px; background: rgba(10, 12, 16, 0.6); color: white; transition: border 0.2s;}
        .main-inputs input:focus, .main-inputs select:focus { border-color: rgba(58, 226, 178, 0.5); outline: none;}
        
        .rates-panel { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; padding: 1.25rem; background: rgba(10, 12, 16, 0.4); border-radius: 0.8rem; border: 1px dashed rgba(255, 255, 255, 0.1); min-width: 300px;}
        .rates-header { font-size: 0.8rem; color: #64748b; font-weight: 700; letter-spacing: 0.05em; }
        .rates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.75rem; }
        .rate-item { display: flex; flex-direction: column; gap: 0.3rem; }
        .rate-item label { font-size: 0.8rem; color: #94a3b8; }
        .rate-item input { width: 100%; padding: 0.5rem; font-size: 0.95rem; font-weight: 700; color: #3ae2b2; background: rgba(255, 255, 255, 0.03); border-radius: 0.5rem; border: 1px solid rgba(255, 255, 255, 0.05); }
        .rate-item input:focus { border-color: #3ae2b2; outline: none; }
        
        .btn-calculate {
            padding: 1rem 2.5rem; background: linear-gradient(135deg, #3ae2b2 0%, #25e2e8 100%);
            color: #06070a; border: none; border-radius: 0.8rem; font-size: 1.15rem; font-weight: 800; cursor: pointer;
            letter-spacing: 0.02em; box-shadow: 0 4px 20px rgba(37, 226, 232, 0.25); transition: all 0.2s; height: 100%; min-height: 70px;}
        .btn-calculate:hover { box-shadow: 0 6px 25px rgba(37, 226, 232, 0.4); transform: translateY(-2px); }
        .btn-calculate:active { transform: scale(0.98); }
        
        .results-section { display: flex; flex-direction: column; gap: 1.5rem; }
        .results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        
        .result-card {
            background: rgba(10, 12, 16, 0.6); padding: 1.5rem; border-radius: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease-in-out;
        }
        .result-card.success { background: linear-gradient(to right, rgba(37, 226, 232, 0.03), rgba(10, 12, 16, 0.6)); border-left: 3px solid #3ae2b2; }
        
        .result-text { font-size: 1.1rem; color: #e2e8f0; }
        .result-text strong.country { font-weight: 700; color: #94a3b8; margin-right: 0.5rem;}
        .result-text strong.accent { font-weight: 800; color: #3ae2b2; }
        .code-block { display: flex; align-items: center; gap: 0.75rem;}
        .result-empty { color: #64748b; font-size: 1rem; }
        
        .code-badge { background: linear-gradient(135deg, #3ae2b2 0%, #25e2e8 100%); color: #06070a; padding: 0.5rem 1rem; border-radius: 0.4rem; font-weight: 800; font-size: 1.3rem; letter-spacing: 0.05em; font-family: 'Space Grotesk', monospace; box-shadow: 0 2px 10px rgba(37, 226, 232, 0.2); }
        
        .btn-copy { width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); color: #3ae2b2; border: 1px solid rgba(58, 226, 178, 0.3); border-radius: 0.75rem; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; }
        .btn-copy:hover { background: rgba(58, 226, 178, 0.1); border-color: #3ae2b2; }
        .hidden { display: none; }

        #toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 12px 24px; border-radius: 0.5rem; font-weight: bold; opacity: 0; transition: all 0.3s ease-in-out; pointer-events: none; z-index: 1000; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); }
        
        @media (max-width: 1024px) { .country-grid, .results-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .country-grid, .results-grid, .control-panel, .main-inputs { grid-template-columns: 1fr; flex-direction: column; } .main-inputs input, .main-inputs select, .btn-calculate { width: 100%; } }
    </style>
</head>
<body>
    <div id="toast">✅ 配置已成功保存至本地！</div>
    <div class="container">
        <div class="header">
            <h1>⚡ CodeX V3</h1>
            <p>大促自动换算器，基于全球动态汇率计算的最优Code自动匹配工具</p>
        </div>

        <div class="glass-card">
            <div class="card-title">
                <span>🌍 1. 填写国家与code挡位, 并保存配置。</span>
                <div class="btn-group">
                    <button class="btn btn-add" id="addCountryBtn">➕ 添加国家</button>
                    <button class="btn btn-save" id="saveDataBtn">💾 保存当前配置</button>
                </div>
            </div>
            <div class="country-grid" id="countryGrid"></div>
        </div>

        <div class="glass-card">
            <div class="card-title">💰 2. 填写产品价格！</div>
            <div class="control-panel">
                <div class="main-inputs">
                    <div class="input-pair">
                        <label>单价货币</label>
                        <select id="productCurrency">
                            <option value="USD">$ USD</option>
                            <option value="EUR">€ EUR</option>
                        </select>
                    </div>
                    <div class="input-pair">
                        <label>基准底价</label>
                        <input type="number" id="productPrice" placeholder="例: 260" step="0.01">
                    </div>
                    <div class="input-pair">
                        <label>SKU 命名 (生成文件用)</label>
                        <input type="text" id="skuNameInput" placeholder="H1B_Promo" value="H1B_Promo">
                    </div>
                    <div class="input-pair">
                        <label>产品图片 (PS调用)</label>
                        <input type="text" id="imageNameInput" placeholder="H1B.png" value="H1B.png">
                    </div>
                </div>
                
                <div class="rates-panel" id="ratesPanel">
                    <div class="rates-header">⚙️ 实时对标汇率 (1 USD = ?)</div>
                    <div class="rates-grid" id="ratesGrid"></div>
                </div>

                <button class="btn-calculate" id="calculateBtn">🎯 开始运行</button>
            </div>
        </div>

        <div class="glass-card hidden" id="resultsCard">
            <div class="card-title">✨ 匹配结果矩阵</div>
            <div class="results-section">
                <div class="results-grid" id="resultsContainer"></div>
                <button class="btn-copy" id="copyBtn">📋 一键提取 PS 自动化标准数据文本</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_RATES = { EUR: 0.92, GBP: 0.79, SAR: 3.75, KRW: 1320, AED: 3.67, PLN: 4.01, UAH: 39.5, BRL: 5.1, RUB: 90 };
        const SYMBOL_TO_CODE = { '€': 'EUR', '$': 'USD', '£': 'GBP', '₩': 'KRW', 'R$': 'BRL', 'zł': 'PLN', '₴': 'UAH', '¥': 'JPY', '₽': 'RUB' };
        
        let userRatesCache = JSON.parse(localStorage.getItem('aliexpressRatesCache')) || { ...DEFAULT_RATES };

        const defaultSetup = [
            { c: 'SA', s: 'SAR', t: '' }, { c: 'ES', s: '€', t: '' }, { c: 'DE', s: '€', t: '' },
            { c: 'UAE', s: 'AED', t: '' }, { c: 'KR', s: '₩', t: '' }, { c: 'Others', s: '$', t: '' }
        ];

        const countryGrid = document.getElementById('countryGrid');

        function createBoxHTML(country, symbol, text) {
            return `
                <div class="country-box">
                    <button class="btn-remove" onclick="this.parentElement.remove(); updateRatesPanel();" title="移除此国家">×</button>
                    <div class="country-info">
                        <input type="text" class="c-code" value="${country}" placeholder="国家(如ES)">
                        <input type="text" class="c-curr" value="${symbol}" placeholder="符号(如€)">
                    </div>
                    <textarea class="c-text-block" placeholder="粘贴文本，如：\n15€-3€\nESAE03">${text}</textarea>
                </div>
            `;
        }

        function updateRatesPanel() {
            const panel = document.getElementById('ratesGrid');
            const uniqueCurrencies = new Set();
            
            document.querySelectorAll('.c-curr').forEach(input => {
                let curr = input.value.toUpperCase().trim();
                curr = SYMBOL_TO_CODE[curr] || curr;
                if (curr && curr !== 'USD' && curr !== '$') uniqueCurrencies.add(curr);
            });

            let html = '';
            
            uniqueCurrencies.forEach(c => {
                const val = userRatesCache[c] || DEFAULT_RATES[c] || 1;
                html += `
                    <div class="rate-item">
                        <label>${c}</label>
                        <input type="number" step="0.0001" class="dyn-rate" data-curr="${c}" value="${val}">
                    </div>
                `;
            });
            
            if(uniqueCurrencies.size === 0) {
                panel.innerHTML = '<div style="font-size:0.85rem; color:#64748b;">当前无需汇率换算</div>';
            } else {
                panel.innerHTML = html;
                panel.querySelectorAll('.dyn-rate').forEach(input => {
                    input.addEventListener('change', (e) => {
                        userRatesCache[e.target.dataset.curr] = parseFloat(e.target.value) || 1;
                        localStorage.setItem('aliexpressRatesCache', JSON.stringify(userRatesCache));
                    });
                });
            }
        }

        function loadData() {
            const savedData = localStorage.getItem('aliexpressDataCache');
            let setup = defaultSetup;
            
            if (savedData) {
                const parsed = JSON.parse(savedData);
                if (parsed.boxes && parsed.boxes.length > 0) setup = parsed.boxes;
                if (parsed.price) document.getElementById('productPrice').value = parsed.price;
                if (parsed.currency) document.getElementById('productCurrency').value = parsed.currency;
            }
            countryGrid.innerHTML = setup.map(item => createBoxHTML(item.c, item.s, item.t)).join('');
            updateRatesPanel(); 
        }

        countryGrid.addEventListener('input', (e) => {
            if (e.target.classList.contains('c-text-block')) {
                const match = e.target.value.match(/(EUR|USD|GBP|SAR|KRW|AED|PLN|UAH|BRL|RUB|JPY|[$€£₩¥₽]|R\$|zł)/i);
                if (match) {
                    let detected = match[1].toUpperCase();
                    const codeToSymbol = { 'EUR':'€', 'USD':'$', 'GBP':'£', 'KRW':'₩', 'BRL':'R$', 'PLN':'zł', 'UAH':'₴' };
                    let displaySymbol = codeToSymbol[detected] || detected;
                    
                    const currInput = e.target.parentElement.querySelector('.c-curr');
                    if (!currInput.value) {
                        currInput.value = displaySymbol;
                        updateRatesPanel(); 
                    }
                }
            }
            if (e.target.classList.contains('c-curr')) {
                updateRatesPanel(); 
            }
        });

        document.getElementById('saveDataBtn').addEventListener('click', () => {
            const boxes = Array.from(document.querySelectorAll('.country-box')).map(box => ({
                c: box.querySelector('.c-code').value, s: box.querySelector('.c-curr').value, t: box.querySelector('.c-text-block').value
            }));
            localStorage.setItem('aliexpressDataCache', JSON.stringify({
                price: document.getElementById('productPrice').value, currency: document.getElementById('productCurrency').value, boxes: boxes
            }));
            const toast = document.getElementById('toast');
            toast.style.opacity = 1; setTimeout(() => toast.style.opacity = 0, 2000);
        });

        document.getElementById('addCountryBtn').addEventListener('click', () => {
            countryGrid.insertAdjacentHTML('beforeend', createBoxHTML('', '', ''));
        });

        loadData();

        document.getElementById('calculateBtn').addEventListener('click', () => {
            const price = parseFloat(document.getElementById('productPrice').value);
            const baseCurrency = document.getElementById('productCurrency').value;

            if (!price) { alert('请输入产品底价！'); return; }

            const getRate = (code) => {
                if (code === 'USD' || code === 'USD') return 1;
                if (code === 'EUR' || code === 'EUR') return userRatesCache['EUR'];
                return userRatesCache[code] || 1;
            };

            const boxes = document.querySelectorAll('.country-box');
            const results = [];

            boxes.forEach(box => {
                const country = box.querySelector('.c-code').value.toUpperCase().trim();
                const rawSymbol = box.querySelector('.c-curr').value.trim();
                const textBlock = box.querySelector('.c-text-block').value.trim();
                
                if (!country || !textBlock) return;
                
                const currencyCode = SYMBOL_TO_CODE[rawSymbol.toUpperCase()] || rawSymbol.toUpperCase();
                const lines = textBlock.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const tiers = [];
                
                for (let i = 0; i < lines.length; i++) {
                    const numMatch = lines[i].match(/([\d,]+(?:\.\d+)?)[^\d\-\~至减]*?[\-–—~至减][^\d]*?([\d,]+(?:\.\d+)?)/);
                    if (numMatch) {
                        let threshold = parseFloat(numMatch[1].replace(/,/g, ''));
                        let discount = parseFloat(numMatch[2].replace(/,/g, ''));
                        let code = '';
                        
                        if (i + 1 < lines.length && /^[A-Z0-9]{4,15}$/i.test(lines[i+1].replace(/[\s]/g, ''))) {
                            code = lines[i+1].replace(/[\s]/g, '').toUpperCase();
                            i++; 
                        } else {
                            const words = lines[i].split(/[\s,]+/);
                            for (let word of words) {
                                if (/^[A-Z0-9]{4,15}$/i.test(word) && !word.includes('-') && !/^\d+$/.test(word)) { code = word.toUpperCase(); break; }
                            }
                        }
                        if (!isNaN(threshold) && !isNaN(discount) && code) tiers.push({ threshold, discount, code });
                    }
                }

                if (tiers.length === 0) return;

                const convertedPrice = price * (getRate(currencyCode) / getRate(baseCurrency));
                const validTiers = tiers.filter(t => convertedPrice >= t.threshold).sort((a, b) => b.discount - a.discount);

                results.push({ country, rawSymbol, convertedPrice, best: validTiers.length > 0 ? validTiers[0] : null });
            });

            renderResults(results);
        });

        function renderResults(results) {
            const container = document.getElementById('resultsContainer');
            if (results.length === 0) { alert('未提取到有效数据！'); return; }

            container.innerHTML = results.map(r => {
                if (!r.best) {
                    return `
                        <div class="result-card">
                            <span class="result-empty">未达匹配门槛 → <strong>${r.country}</strong></span>
                        </div>
                    `;
                }
                
                const tStr = r.best.threshold.toLocaleString('en-US');
                const dStr = r.best.discount.toLocaleString('en-US');
                
                return `
                    <div class="result-card success">
                        <span class="result-text"><strong class="country">${r.country}</strong><strong class="accent">${r.rawSymbol} ${tStr}-${dStr}</strong></span>
                        <div class="code-block"><span class="code-badge">${r.best.code}</span></div>
                    </div>
                `;
            }).join('');

            document.getElementById('resultsCard').classList.remove('hidden');
            document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth' });
            window.latestResults = results;
        }

        // --- 极简纯行复制逻辑：完全去掉表头 ---
        document.getElementById('copyBtn').addEventListener('click', () => {
            if (!window.latestResults) return;
            
            const skuName = document.getElementById('skuNameInput').value.trim() || "Auto_SKU"; 
            const imageName = document.getElementById('imageNameInput').value.trim() || "Auto_Image.png"; 

            let priceData = { SA: '', FR: '', DE: '', KR: '', GCC: '', Other: '' };
            let codeData = { SA: '', FR: '', DE: '', KR: '', GCC: '', Other: '' };

            // 杀毒函数：拔掉所有千分位逗号
            const safeFormat = (num) => {
                return num.toString().replace(/,/g, '');
            };

            window.latestResults.forEach(r => {
                if (!r.best) return;
                
                const country = r.country.toUpperCase();
                const priceStr = `${safeFormat(r.best.threshold)}-${safeFormat(r.best.discount)}`;
                const codeStr = r.best.code;

                if (country === 'SA') {
                    priceData.SA = `SAR ${priceStr}`; codeData.SA = codeStr;
                } else if (country === 'FR' || country === 'ES') { 
                    priceData.FR = `€${priceStr}`; codeData.FR = codeStr;
                } else if (country === 'DE') {
                    priceData.DE = `€${priceStr}`; codeData.DE = codeStr;
                } else if (country === 'KR') {
                    priceData.KR = `₩${priceStr}`; codeData.KR = codeStr;
                } else if (country === 'UAE' || country === 'GCC') { 
                    priceData.GCC = `$${priceStr}`; codeData.GCC = codeStr;
                } else if (country === 'OTHERS' || country === 'US' || country === 'OTHER') {
                    priceData.Other = `$${priceStr}`; codeData.Other = codeStr;
                }
            });

            // 仅仅组装逗号数据行，不再拼接上面的 SKU_Name 等表头文本
            const dataRow = `${skuName},${imageName},${priceData.SA},${codeData.SA},${priceData.FR},${codeData.FR},${priceData.DE},${codeData.DE},${priceData.KR},${codeData.KR},${priceData.GCC},${codeData.GCC},${priceData.Other},${codeData.Other}`;
            
            // 写入剪贴板 (只有干干净净的一行数据)
            navigator.clipboard.writeText(dataRow).then(() => {
                const toast = document.getElementById('toast');
                toast.textContent = "✅ 数据行已成功复制！请前往主 TXT 文件另起一行粘贴";
                toast.style.opacity = 1; 
                setTimeout(() => { toast.style.opacity = 0; }, 3000);
            }).catch(err => {
                console.error("复制失败: ", err);
                alert("复制失败，请重试或检查浏览器权限。");
            });
        });
    </script>
</body>
</html>
