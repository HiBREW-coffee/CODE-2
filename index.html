<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliExpress 促销码智能匹配器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        
        .header { text-align: center; color: white; padding: 1rem 0; }
        .header h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; }
        
        .card { background: white; border-radius: 1rem; padding: 2rem; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .card-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.2rem; color: #1a1a2e; border-bottom: 2px solid #f0f0f0; padding-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center;}
        
        .btn-group { display: flex; gap: 1rem; }
        .btn-small { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.9rem; font-weight: bold; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-save { background: #10b981; color: white; }
        .btn-save:hover { background: #059669; }
        .btn-add { background: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
        .btn-add:hover { background: #e5e7eb; }
        
        .country-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .country-box { background: #f8f9ff; padding: 1rem; border-radius: 0.75rem; border: 1px solid #e6e9fe; display: flex; flex-direction: column; gap: 0.5rem; position: relative; }
        .country-info { display: flex; gap: 0.5rem; align-items: center; }
        .country-info input { padding: 0.4rem; border: 1px solid #d1d5db; border-radius: 0.4rem; font-size: 0.95rem; font-weight: bold; text-align: center; }
        .c-code { width: 80px; color: #1a1a2e; }
        .c-curr { width: 60px; color: #667eea; background: #eef2ff;}
        .btn-remove { position: absolute; top: 0.8rem; right: 0.8rem; background: none; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer; opacity: 0.5; }
        
        textarea { width: 100%; height: 110px; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.85rem; font-family: monospace; resize: none; line-height: 1.4; color: #4b5563; }
        textarea:focus, input:focus, select:focus { border-color: #667eea; outline: none; }
        
        .action-bar { display: flex; gap: 1.5rem; align-items: flex-end; background: #f8f9ff; padding: 1.5rem; border-radius: 0.75rem; border: 1px solid #e6e9fe; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        label { font-size: 0.85rem; font-weight: 700; color: #444; }
        .action-bar input, .action-bar select { padding: 0.8rem; border: 2px solid #e0e0e0; border-radius: 0.5rem; font-size: 1.1rem; font-weight: bold; width: 150px; }
        
        /* 动态汇率面板 */
        .rates-panel { display: flex; gap: 1rem; flex-wrap: wrap; padding: 1rem; background: #fff; border-radius: 0.5rem; border: 1px dashed #ccc; flex: 1; align-items: center; }
        .rate-item { display: flex; flex-direction: column; gap: 0.2rem; }
        .rate-item input { width: 80px; padding: 0.4rem; font-size: 0.9rem; font-weight: bold; color: #667eea; border: 1px solid #d1d5db; border-radius: 0.3rem; }
        
        .btn-primary { padding: 1rem 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 0.75rem; font-size: 1.2rem; font-weight: 700; cursor: pointer; }
        
        .results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1rem; }
        .result-item { background: #fff; padding: 1.5rem; border-radius: 0.5rem; border: 2px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
        .result-item.success { border-color: #667eea; background: #f8f9ff; }
        .result-text { color: #1a1a2e; font-weight: 600; }
        .result-text strong { color: #667eea; font-weight: 800;}
        .code-badge { background: #667eea; color: white; padding: 0.4rem 0.8rem; border-radius: 0.3rem; font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; }
        .r-empty { color: #9ca3af; font-weight: normal; }
        
        .btn-copy { width: 100%; padding: 1rem; background: #667eea; color: white; border: none; border-radius: 0.5rem; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 1.5rem; }
        .hidden { display: none; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
        
        @media (max-width: 1024px) { .country-grid, .results-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .country-grid, .results-grid, .action-bar { grid-template-columns: 1fr; flex-direction: column; } .action-bar input, .action-bar select { width: 100%; } }
    </style>
</head>
<body>
    <div id="toast">保存成功！</div>
    <div class="container">
        <div class="header">
            <h1>⚡ HiBREW 大促Code 匹配器</h1>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🌍 1. 粘贴各国大促规则文本 (支持全球任意符号 R$ / zł / £ 等)</span>
                <div class="btn-group">
                    <button class="btn-small btn-add" id="addCountryBtn">➕ 添加国家</button>
                    <button class="btn-small btn-save" id="saveDataBtn">💾 保存当前配置</button>
                </div>
            </div>
            <div class="country-grid" id="countryGrid"></div>
        </div>

        <div class="card">
            <div class="card-title">💰 2. 录入底价与全自动汇率面板</div>
            <div class="action-bar">
                <div class="input-group">
                    <label>单价货币</label>
                    <select id="productCurrency">
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>产品基准底价</label>
                    <input type="number" id="productPrice" placeholder="例: 260" step="0.01">
                </div>
                
                <div class="rates-panel" id="ratesPanel">
                    </div>

                <button class="btn-primary" id="calculateBtn">🎯 提炼 & 计算</button>
            </div>
        </div>

        <div class="card hidden" id="resultsCard">
            <div class="card-title">✨ 极简匹配结果</div>
            <div class="results-grid" id="resultsContainer"></div>
            <button class="btn-copy" id="copyBtn">📋 一键提取排版文本</button>
        </div>
    </div>

    <script>
        // 内置常见全球货币对应及默认汇率 (不在列表里的也能填，系统会自动创建输入框)
        const DEFAULT_RATES = { EUR: 0.92, GBP: 0.79, SAR: 3.75, KRW: 1320, AED: 3.67, PLN: 4.01, UAH: 39.5, BRL: 5.1, RUB: 90 };
        const SYMBOL_TO_CODE = { '€': 'EUR', '$': 'USD', '£': 'GBP', '₩': 'KRW', 'R$': 'BRL', 'ZŁ': 'PLN', '₴': 'UAH', '¥': 'JPY', '₽': 'RUB' };
        
        let userRatesCache = JSON.parse(localStorage.getItem('aliexpressRatesCache')) || { ...DEFAULT_RATES };

        const defaultSetup = [
            { c: 'SA', s: 'SAR', t: '' }, { c: 'ES', s: '€', t: '' }, { c: 'DE', s: '€', t: '' },
            { c: 'UAE', s: 'AED', t: '' }, { c: 'KR', s: '₩', t: '' }, { c: 'Others', s: '$', t: '' }
        ];

        const countryGrid = document.getElementById('countryGrid');

        function createBoxHTML(country, symbol, text) {
            return `
                <div class="country-box">
                    <button class="btn-remove" onclick="this.parentElement.remove(); updateRatesPanel();" title="移除此国家">×</button>
                    <div class="country-info">
                        <input type="text" class="c-code" value="${country}" placeholder="国家">
                        <input type="text" class="c-curr" value="${symbol}" placeholder="符号">
                    </div>
                    <textarea class="c-text-block" placeholder="粘贴文本，如：\n15€-3€\nESAE03">${text}</textarea>
                </div>
            `;
        }

        // 🌟 动态刷新汇率面板（核心黑科技）
        function updateRatesPanel() {
            const panel = document.getElementById('ratesPanel');
            const uniqueCurrencies = new Set();
            
            // 扫描所有输入框里的货币
            document.querySelectorAll('.c-curr').forEach(input => {
                let curr = input.value.toUpperCase().trim();
                curr = SYMBOL_TO_CODE[curr] || curr;
                if (curr && curr !== 'USD' && curr !== '$') uniqueCurrencies.add(curr);
            });

            let html = '<div style="width:100%; font-size:0.8rem; color:#666; font-weight:bold;">⚙️ 动态全局汇率对标 (1 USD = ?)</div>';
            
            uniqueCurrencies.forEach(c => {
                const val = userRatesCache[c] || DEFAULT_RATES[c] || 1;
                html += `
                    <div class="rate-item">
                        <label>${c} 汇率</label>
                        <input type="number" step="0.0001" class="dyn-rate" data-curr="${c}" value="${val}">
                    </div>
                `;
            });
            
            if(uniqueCurrencies.size === 0) {
                html += '<div style="font-size:0.85rem; color:#999;">无需额外汇率转换</div>';
            }

            panel.innerHTML = html;

            // 监听用户手动修改新汇率并自动保存
            panel.querySelectorAll('.dyn-rate').forEach(input => {
                input.addEventListener('change', (e) => {
                    userRatesCache[e.target.dataset.curr] = parseFloat(e.target.value) || 1;
                    localStorage.setItem('aliexpressRatesCache', JSON.stringify(userRatesCache));
                });
            });
        }

        function loadData() {
            const savedData = localStorage.getItem('aliexpressDataCache');
            let setup = defaultSetup;
            
            if (savedData) {
                const parsed = JSON.parse(savedData);
                if (parsed.boxes && parsed.boxes.length > 0) setup = parsed.boxes;
                if (parsed.price) document.getElementById('productPrice').value = parsed.price;
                if (parsed.currency) document.getElementById('productCurrency').value = parsed.currency;
            }
            countryGrid.innerHTML = setup.map(item => createBoxHTML(item.c, item.s, item.t)).join('');
            
            updateRatesPanel(); // 初始化加载时生成面板
        }

        // 事件委托：监听符号和文本的自动补全
        countryGrid.addEventListener('input', (e) => {
            if (e.target.classList.contains('c-text-block')) {
                // 更强大的全局符号正则捕捉
                const match = e.target.value.match(/(EUR|USD|GBP|SAR|KRW|AED|PLN|UAH|BRL|RUB|JPY|[$€£₩¥₽]|R\$|ZŁ)/i);
                if (match) {
                    let detected = match[1].toUpperCase();
                    // 将提取到的全称逆向转换为你想要的极简符号
                    const codeToSymbol = { 'EUR':'€', 'USD':'$', 'GBP':'£', 'KRW':'₩', 'BRL':'R$', 'PLN':'zł', 'UAH':'₴' };
                    let displaySymbol = codeToSymbol[detected] || detected;
                    
                    const currInput = e.target.parentElement.querySelector('.c-curr');
                    // 仅当用户没填符号时才自动帮忙填入
                    if (!currInput.value) {
                        currInput.value = displaySymbol;
                        updateRatesPanel(); // 自动新增汇率框
                    }
                }
            }
            if (e.target.classList.contains('c-curr')) {
                updateRatesPanel(); // 用户手动改符号时，实时刷新面板
            }
        });

        document.getElementById('saveDataBtn').addEventListener('click', () => {
            const boxes = Array.from(document.querySelectorAll('.country-box')).map(box => ({
                c: box.querySelector('.c-code').value, s: box.querySelector('.c-curr').value, t: box.querySelector('.c-text-block').value
            }));
            localStorage.setItem('aliexpressDataCache', JSON.stringify({
                price: document.getElementById('productPrice').value, currency: document.getElementById('productCurrency').value, boxes: boxes
            }));
            const toast = document.getElementById('toast');
            toast.style.opacity = 1; setTimeout(() => toast.style.opacity = 0, 2000);
        });

        document.getElementById('addCountryBtn').addEventListener('click', () => {
            countryGrid.insertAdjacentHTML('beforeend', createBoxHTML('', '', ''));
        });

        loadData();

        document.getElementById('calculateBtn').addEventListener('click', () => {
            const price = parseFloat(document.getElementById('productPrice').value);
            const baseCurrency = document.getElementById('productCurrency').value;

            if (!price) { alert('请输入产品底价！'); return; }

            const getRate = (code) => {
                if (code === 'USD') return 1;
                return userRatesCache[code] || DEFAULT_RATES[code] || 1;
            };

            const boxes = document.querySelectorAll('.country-box');
            const results = [];

            boxes.forEach(box => {
                const country = box.querySelector('.c-code').value.toUpperCase().trim();
                const rawSymbol = box.querySelector('.c-curr').value.trim();
                const textBlock = box.querySelector('.c-text-block').value.trim();
                
                if (!country || !textBlock) return;
                
                const currencyCode = SYMBOL_TO_CODE[rawSymbol.toUpperCase()] || rawSymbol.toUpperCase();
                const lines = textBlock.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const tiers = [];
                
                for (let i = 0; i < lines.length; i++) {
                    const numMatch = lines[i].match(/([\d,]+(?:\.\d+)?)[^\d\-\~至减]*?[\-–—~至减][^\d]*?([\d,]+(?:\.\d+)?)/);
                    if (numMatch) {
                        let threshold = parseFloat(numMatch[1].replace(/,/g, ''));
                        let discount = parseFloat(numMatch[2].replace(/,/g, ''));
                        let code = '';
                        
                        if (i + 1 < lines.length && /^[A-Z0-9]{4,15}$/i.test(lines[i+1].replace(/[\s]/g, ''))) {
                            code = lines[i+1].replace(/[\s]/g, '').toUpperCase();
                            i++; 
                        } else {
                            const words = lines[i].split(/[\s,]+/);
                            for (let word of words) {
                                if (/^[A-Z0-9]{4,15}$/i.test(word) && !word.includes('-') && !/^\d+$/.test(word)) { code = word.toUpperCase(); break; }
                            }
                        }
                        if (!isNaN(threshold) && !isNaN(discount) && code) tiers.push({ threshold, discount, code });
                    }
                }

                if (tiers.length === 0) return;

                const convertedPrice = price * (getRate(currencyCode) / getRate(baseCurrency));
                const validTiers = tiers.filter(t => convertedPrice >= t.threshold).sort((a, b) => b.discount - a.discount);

                results.push({ country, rawSymbol, convertedPrice, best: validTiers.length > 0 ? validTiers[0] : null });
            });

            renderResults(results);
        });

        function renderResults(results) {
            const container = document.getElementById('resultsContainer');
            if (results.length === 0) { alert('未提取到有效数据！'); return; }

            container.innerHTML = results.map(r => {
                if (!r.best) {
                    return `
                        <div class="result-item">
                            <span class="r-empty">未匹配到 <strong>${r.country}</strong> 可用门槛</span>
                        </div>
                    `;
                }
                
                const tStr = r.best.threshold.toLocaleString('en-US');
                const dStr = r.best.discount.toLocaleString('en-US');
                
                return `
                    <div class="result-item success">
                        <span class="result-text">满足 <strong>${r.country}</strong> code ${r.rawSymbol} ${tStr}-${dStr}</span>
                        <span>code：<span class="code-badge">${r.best.code}</span></span>
                    </div>
                `;
            }).join('');

            document.getElementById('resultsCard').classList.remove('hidden');
            window.latestResults = results;
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            if (!window.latestResults) return;
            const text = window.latestResults
                .filter(r => r.best)
                .map(r => {
                    const tStr = r.best.threshold.toLocaleString('en-US');
                    const dStr = r.best.discount.toLocaleString('en-US');
                    return `满足 ${r.country} code ${r.rawSymbol} ${tStr}-${dStr} code：${r.best.code}`;
                })
                .join('\n');
            navigator.clipboard.writeText(text).then(() => alert('🎉 结果已按照指定格式复制成功！'));
        });
    </script>
</body>
</html>
