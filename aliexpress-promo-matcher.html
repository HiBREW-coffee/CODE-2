<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliExpress 促销码智能匹配器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .header-title {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.25rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #1a1a2e;
        }

        .upload-zone {
            border: 2px dashed #667eea;
            border-radius: 0.75rem;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-zone:hover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .upload-zone.dragover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .upload-zone p {
            margin: 0.5rem 0;
        }

        .upload-filename {
            margin-top: 1rem;
            color: #667eea;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .input-wrapper {
            flex: 1;
        }

        .input-wrapper.small {
            width: 120px;
            flex: none;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1a1a2e;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
        }

        .btn-primary {
            width: 100%;
            margin-top: 2rem;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .tier-list {
            max-height: 500px;
            overflow-y: auto;
            background: #f8f9ff;
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .tier-item {
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .tier-code {
            background: #667eea;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }

        .result-flag {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .result-country {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1a1a2e;
        }

        .result-code-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .result-details {
            font-size: 0.875rem;
            color: #666;
            line-height: 1.6;
        }

        .result-final {
            margin-top: 0.5rem;
            font-weight: 700;
            color: #667eea;
            font-size: 1rem;
        }

        .btn-copy {
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        details {
            margin-top: 2rem;
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        summary {
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1a1a2e;
            user-select: none;
            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        .rates-grid {
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 2rem;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
            .rates-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <span style="font-size: 3rem;">⚡</span>
                <h1>AliExpress 促销码智能匹配器</h1>
            </div>
            <p>自动识别价格、计算汇率、匹配最优档位，让跨境促销轻松搞定</p>
        </div>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- 左侧：上传区域 -->
            <div class="card">
                <h2 class="card-title">📊 促销档位设置</h2>

                <!-- 促销档位上传 -->
                <div class="upload-zone" id="promoUploadZone">
                    <input type="file" id="promoUpload" accept=".csv,.xlsx,.xls,.png,.jpg,.jpeg">
                    <label for="promoUpload" style="cursor: pointer;">
                        <div class="upload-icon">📄</div>
                        <p style="font-weight: 600; margin-bottom: 0.5rem; color: #1a1a2e;">
                            上传促销档位表
                        </p>
                        <p style="font-size: 0.875rem; color: #666;">
                            支持 CSV、Excel 或图片格式
                        </p>
                        <p class="upload-filename" id="promoFilename"></p>
                    </label>
                </div>

                <!-- 产品价格输入 -->
                <h2 class="card-title" style="margin-top: 2rem;">💰 产品价格</h2>

                <!-- 图片识别价格 -->
                <div class="upload-zone" id="productImageZone">
                    <input type="file" id="productImageUpload" accept="image/*">
                    <label for="productImageUpload" style="cursor: pointer;">
                        <div class="upload-icon">🖼️</div>
                        <p style="font-weight: 600; font-size: 0.95rem; color: #1a1a2e;">
                            上传产品图片自动识别价格
                        </p>
                    </label>
                </div>

                <!-- 手动输入价格 -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <label>产品价格</label>
                        <input type="number" id="productPrice" placeholder="75.00" step="0.01">
                    </div>
                    <div class="input-wrapper small">
                        <label>货币</label>
                        <select id="productCurrency">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="SAR">SAR</option>
                            <option value="KRW">KRW</option>
                            <option value="AED">AED</option>
                        </select>
                    </div>
                </div>

                <!-- 计算按钮 -->
                <button class="btn-primary" id="calculateBtn">
                    🧮 开始计算匹配
                </button>
            </div>

            <!-- 右侧：档位信息预览 -->
            <div class="card">
                <h2 class="card-title">📋 已加载档位 (<span id="tierCount">0</span>)</h2>
                
                <div class="tier-list" id="tierList">
                    <div class="empty-state">
                        暂无档位数据，请上传促销档位表
                    </div>
                </div>
            </div>
        </div>

        <!-- 匹配结果 -->
        <div class="card hidden" id="resultsCard">
            <div class="results-header">
                <h2 style="font-size: 1.75rem; font-weight: 700; color: #1a1a2e; margin: 0;">
                    🎯 最优匹配结果
                </h2>
                <button class="btn-copy" id="copyBtn">
                    📋 复制结果
                </button>
            </div>

            <div class="results-grid" id="resultsGrid">
                <!-- 结果将动态插入这里 -->
            </div>
        </div>

        <!-- 汇率设置 -->
        <details>
            <summary>⚙️ 高级设置：自定义汇率</summary>
            <div class="rates-grid" id="ratesGrid">
                <div>
                    <label>USD 汇率</label>
                    <input type="number" step="0.01" value="1" data-currency="USD" class="rate-input">
                </div>
                <div>
                    <label>EUR 汇率</label>
                    <input type="number" step="0.01" value="0.92" data-currency="EUR" class="rate-input">
                </div>
                <div>
                    <label>GBP 汇率</label>
                    <input type="number" step="0.01" value="0.79" data-currency="GBP" class="rate-input">
                </div>
                <div>
                    <label>SAR 汇率</label>
                    <input type="number" step="0.01" value="3.75" data-currency="SAR" class="rate-input">
                </div>
                <div>
                    <label>KRW 汇率</label>
                    <input type="number" step="0.01" value="1320" data-currency="KRW" class="rate-input">
                </div>
                <div>
                    <label>AED 汇率</label>
                    <input type="number" step="0.01" value="3.67" data-currency="AED" class="rate-input">
                </div>
            </div>
        </details>
    </div>

    <script>
        // 全局状态
        const state = {
            promoTiers: [],
            exchangeRates: {
                USD: 1,
                EUR: 0.92,
                GBP: 0.79,
                SAR: 3.75,
                KRW: 1320,
                AED: 3.67
            }
        };

        const COUNTRY_CODES = {
            US: { currency: 'USD', flag: '🇺🇸', name: 'United States' },
            FR: { currency: 'EUR', flag: '🇫🇷', name: 'France' },
            DE: { currency: 'EUR', flag: '🇩🇪', name: 'Germany' },
            ES: { currency: 'EUR', flag: '🇪🇸', name: 'Spain' },
            SA: { currency: 'SAR', flag: '🇸🇦', name: 'Saudi Arabia' },
            KR: { currency: 'KRW', flag: '🇰🇷', name: 'South Korea' },
            AE: { currency: 'AED', flag: '🇦🇪', name: 'UAE' }
        };

        // DOM 元素
        const elements = {
            promoUpload: document.getElementById('promoUpload'),
            promoUploadZone: document.getElementById('promoUploadZone'),
            promoFilename: document.getElementById('promoFilename'),
            productImageUpload: document.getElementById('productImageUpload'),
            productImageZone: document.getElementById('productImageZone'),
            productPrice: document.getElementById('productPrice'),
            productCurrency: document.getElementById('productCurrency'),
            calculateBtn: document.getElementById('calculateBtn'),
            tierList: document.getElementById('tierList'),
            tierCount: document.getElementById('tierCount'),
            resultsCard: document.getElementById('resultsCard'),
            resultsGrid: document.getElementById('resultsGrid'),
            copyBtn: document.getElementById('copyBtn'),
            rateInputs: document.querySelectorAll('.rate-input')
        };

        // 初始化汇率输入监听
        elements.rateInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                const currency = e.target.dataset.currency;
                state.exchangeRates[currency] = parseFloat(e.target.value) || 1;
            });
        });

        // 文件上传拖拽处理
        function setupDragDrop(zone, callback) {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) callback(file);
            });
        }

        // 促销档位上传
        setupDragDrop(elements.promoUploadZone, handlePromoFile);
        elements.promoUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) handlePromoFile(e.target.files[0]);
        });

        function handlePromoFile(file) {
            elements.promoFilename.textContent = `✓ ${file.name}`;
            
            if (file.type.includes('image')) {
                analyzePromoImage(file);
            } else {
                parsePromoFile(file);
            }
        }

        // 解析CSV文件
        function parsePromoFile(file) {
            setLoading(true);
            const reader = new FileReader();
            
            reader.onload = (e) => {
                const text = e.target.result;
                const lines = text.split('\n');
                const tiers = [];
                
                lines.slice(1).forEach(line => {
                    const parts = line.split(',').map(s => s.trim());
                    if (parts.length >= 4) {
                        tiers.push({
                            country: parts[0],
                            currency: parts[1],
                            threshold: parseFloat(parts[2]),
                            discount: parseFloat(parts[3]),
                            code: parts[4] || ''
                        });
                    }
                });
                
                state.promoTiers = tiers;
                renderTierList();
                setLoading(false);
            };
            
            reader.readAsText(file);
        }

        // 使用Claude API分析促销图片
        async function analyzePromoImage(file) {
            setLoading(true);
            
            try {
                const base64 = await fileToBase64(file);

                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: [
                                {
                                    type: 'image',
                                    source: { type: 'base64', media_type: 'image/png', data: base64 }
                                },
                                {
                                    type: 'text',
                                    text: `分析这张AliExpress促销图片，提取所有促销档位信息。
                                    
请以JSON格式返回，不要包含markdown代码块标记：
[
  {
    "country": "国家代码（如US, FR, SA等）",
    "currency": "货币代码（如USD, EUR, SAR等）",
    "threshold": 门槛金额（数字）,
    "discount": 优惠金额（数字）,
    "code": "优惠码"
  }
]

提取图片中所有可见的促销档位。`
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                const text = data.content.find(c => c.type === 'text')?.text || '';
                const cleanText = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                const tiers = JSON.parse(cleanText);
                
                state.promoTiers = tiers;
                renderTierList();
            } catch (error) {
                console.error('分析图片失败:', error);
                alert('图片分析失败，请尝试手动上传CSV文件或检查图片格式');
            }
            
            setLoading(false);
        }

        // 产品价格图片识别
        setupDragDrop(elements.productImageZone, analyzeProductImage);
        elements.productImageUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) analyzeProductImage(e.target.files[0]);
        });

        async function analyzeProductImage(file) {
            setLoading(true);
            
            try {
                const base64 = await fileToBase64(file);

                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: [
                                {
                                    type: 'image',
                                    source: { type: 'base64', media_type: 'image/png', data: base64 }
                                },
                                {
                                    type: 'text',
                                    text: `识别这张产品图片中的价格。只返回JSON格式，不要包含其他文字：
{
  "price": 数字金额,
  "currency": "货币代码（USD/EUR/GBP等）"
}`
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                const text = data.content.find(c => c.type === 'text')?.text || '';
                const cleanText = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                const result = JSON.parse(cleanText);
                
                elements.productPrice.value = result.price.toString();
                elements.productCurrency.value = result.currency;
            } catch (error) {
                console.error('识别价格失败:', error);
                alert('价格识别失败，请手动输入');
            }
            
            setLoading(false);
        }

        // 计算匹配
        elements.calculateBtn.addEventListener('click', calculateMatches);

        function calculateMatches() {
            const price = parseFloat(elements.productPrice.value);
            const currency = elements.productCurrency.value;

            if (!price || state.promoTiers.length === 0) {
                alert('请先输入产品价格并上传促销档位信息');
                return;
            }

            const results = {};

            // 按国家分组
            const tiersByCountry = {};
            state.promoTiers.forEach(tier => {
                if (!tiersByCountry[tier.country]) {
                    tiersByCountry[tier.country] = [];
                }
                tiersByCountry[tier.country].push(tier);
            });

            // 为每个国家计算最优档位
            Object.entries(tiersByCountry).forEach(([country, tiers]) => {
                const currencyCode = tiers[0].currency;
                const convertedPrice = price * (state.exchangeRates[currency] / state.exchangeRates[currencyCode]);
                
                const validTiers = tiers
                    .filter(t => convertedPrice >= t.threshold)
                    .sort((a, b) => b.discount - a.discount);

                if (validTiers.length > 0) {
                    const bestTier = validTiers[0];
                    results[country] = {
                        ...bestTier,
                        convertedPrice,
                        finalPrice: convertedPrice - bestTier.discount,
                        savings: bestTier.discount
                    };
                }
            });

            // 选择前6个最优国家
            const topCountries = Object.entries(results)
                .sort((a, b) => b[1].savings - a[1].savings)
                .slice(0, 6)
                .reduce((acc, [country, data]) => {
                    acc[country] = data;
                    return acc;
                }, {});

            renderResults(topCountries);
        }

        // 渲染档位列表
        function renderTierList() {
            elements.tierCount.textContent = state.promoTiers.length;
            
            if (state.promoTiers.length === 0) {
                elements.tierList.innerHTML = '<div class="empty-state">暂无档位数据，请上传促销档位表</div>';
                return;
            }

            elements.tierList.innerHTML = state.promoTiers.map(tier => `
                <div class="tier-item">
                    <div>
                        <div style="font-weight: 600; margin-bottom: 0.25rem;">
                            ${COUNTRY_CODES[tier.country]?.flag || '🌍'} ${tier.country}
                        </div>
                        <div style="font-size: 0.875rem; color: #666;">
                            满 ${tier.threshold} ${tier.currency} 减 ${tier.discount}
                        </div>
                    </div>
                    <div class="tier-code">${tier.code}</div>
                </div>
            `).join('');
        }

        // 渲染结果
        function renderResults(results) {
            if (Object.keys(results).length === 0) {
                alert('没有找到匹配的档位');
                return;
            }

            elements.resultsCard.classList.remove('hidden');
            elements.resultsGrid.innerHTML = Object.entries(results).map(([country, data]) => `
                <div class="result-card">
                    <div class="result-flag">${COUNTRY_CODES[country]?.flag || '🌍'}</div>
                    <div class="result-country">${country}</div>
                    <div class="result-code-badge">${data.code}</div>
                    <div class="result-details">
                        <div>价格: ${data.convertedPrice.toFixed(2)} ${data.currency}</div>
                        <div>门槛: ${data.threshold} ${data.currency}</div>
                        <div>优惠: -${data.discount} ${data.currency}</div>
                        <div class="result-final">
                            实付: ${data.finalPrice.toFixed(2)} ${data.currency}
                        </div>
                    </div>
                </div>
            `).join('');

            // 滚动到结果
            elements.resultsCard.scrollIntoView({ behavior: 'smooth' });

            // 保存结果用于复制
            window.currentResults = results;
        }

        // 复制结果
        elements.copyBtn.addEventListener('click', () => {
            if (!window.currentResults) return;

            const text = Object.entries(window.currentResults)
                .map(([country, data]) => 
                    `${COUNTRY_CODES[country]?.flag || ''} ${country}: ${data.code} (${data.currency} ${data.threshold}-${data.discount})`
                ).join('\n');
            
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制到剪贴板！');
            });
        });

        // 工具函数
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function setLoading(isLoading) {
            elements.calculateBtn.disabled = isLoading;
            elements.calculateBtn.textContent = isLoading ? '⏳ 处理中...' : '🧮 开始计算匹配';
        }
    </script>
</body>
</html>
